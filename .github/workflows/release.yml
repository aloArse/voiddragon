name: Release jar

# build.yml proves the source compiles; this job publishes the same jar as a
# pre-release so it can be downloaded straight to a phone without signing in to
# GitHub and digging through Actions artifacts.
on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Unpack project
        run: unzip -q voiddragon-source.zip -d src_build
      - name: Build
        working-directory: src_build/voiddragon
        run: gradle build --no-daemon
      - name: Delete the previous rolling release
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the jar
        run: |
          gh release create latest \
            --title "Void Dragon 1.0.0 (latest build)" \
            --notes "ساخته‌شده از آخرین push روی \`${{ github.ref_name }}\` (run ${{ github.run_number }}). فایل voiddragon-1.0.0.jar را بردارید و در پوشهٔ mods بریزید." \
            --prerelease \
            src_build/voiddragon/build/libs/*.jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
